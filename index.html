<title>Daniel Paiva</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">

<style>
  /* layout: single-column centered, mobile-first bio page */
  :root {
    --bg: #0a0a0a;
    --fg: #f0f0f0;
    --muted: #888;
    --border: #1f1f1f;
    --btn-bg: #f0f0f0;
    --btn-fg: #0a0a0a;
    --btn-hover: #d4d4d4;
    --sub-bg: #111;
    --sub-border: #222;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-block: max(env(safe-area-inset-top, 0px) + 2rem, 2rem) max(env(safe-area-inset-bottom, 0px) + 2rem, 2rem);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  .container {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* avatar placeholder */
  .avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: #1f1f1f;
    border: 2px solid #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.25rem;
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: -0.02em;
  }

  .name {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 0.35rem;
    text-align: center;
  }

  .tagline {
    font-size: 0.9rem;
    color: var(--muted);
    text-align: center;
    margin: 0 0 2rem;
    line-height: 1.5;
  }

  .section-label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.85rem;
    text-align: center;
  }

  .btn-group {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    margin-bottom: 2rem;
  }

  .btn-primary {
    display: block;
    width: 100%;
    padding: 1rem 1.25rem;
    background: var(--btn-bg);
    color: var(--btn-fg);
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: 0.95rem;
    text-align: center;
    transition: background 0.15s, transform 0.1s;
    letter-spacing: -0.01em;
  }

  .btn-primary:hover {
    background: var(--btn-hover);
  }

  .btn-primary:active {
    transform: scale(0.98);
  }

  .btn-secondary {
    display: block;
    width: 100%;
    padding: 0.9rem 1.25rem;
    background: var(--sub-bg);
    color: var(--fg);
    border: 1px solid var(--sub-border);
    border-radius: 10px;
    text-decoration: none;
    font-weight: 500;
    font-size: 0.85rem;
    text-align: center;
    transition: border-color 0.15s, transform 0.1s;
    line-height: 1.4;
    color: var(--muted);
  }

  .btn-secondary:hover {
    border-color: #333;
    color: var(--fg);
  }

  .btn-secondary:active {
    transform: scale(0.98);
  }

  .divider {
    width: 100%;
    height: 1px;
    background: var(--border);
    margin-bottom: 1.5rem;
  }

  .social-link {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
    transition: color 0.15s;
  }

  .social-link:hover {
    color: var(--fg);
  }

  .ig-icon {
    width: 16px;
    height: 16px;
    opacity: 0.6;
  }
</style>
